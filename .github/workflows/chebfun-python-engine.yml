# Executes Python -> MATLAB Engine -> Chebfun on a locally licensed Windows runner.
# Windows self-hosted runner needs the custom label "matlab-engine".
name: Python calls MATLAB Chebfun (Engine)

on:
  workflow_dispatch:
    inputs:
      matlab_release:
        description: MATLAB release installed and licensed on the Windows runner
        type: choice
        required: true
        default: R2026a
        options:
          - R2026a
          - R2026b

permissions:
  contents: read

jobs:
  python-chebfun-engine:
    runs-on: [self-hosted, windows, x64, matlab-engine]
    timeout-minutes: 30
    env:
      MATLAB_RELEASE: ${{ inputs.matlab_release }}
    steps:
      - name: Checkout Chebfun
        uses: actions/checkout@v4

      - name: Verify locally licensed MATLAB
        shell: pwsh
        run: |
          $matlabRoot = Join-Path $env:ProgramFiles "MATLAB\$env:MATLAB_RELEASE"
          $matlabExe = Join-Path $matlabRoot 'bin\matlab.exe'
          if (-not (Test-Path $matlabExe)) {
            throw "MATLAB installation not found: $matlabExe"
          }
          & $matlabExe -batch "assert(strcmp(['R' version('-release')], '$env:MATLAB_RELEASE')); disp(version)"
          if ($LASTEXITCODE -ne 0) { throw "MATLAB command failed: $LASTEXITCODE" }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $matlabRoot 'bin')

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64

      - name: Install NumPy
        shell: pwsh
        run: python -m pip install --disable-pip-version-check numpy==2.3.5

      - name: Install Engine from the matching MATLAB installation
        shell: pwsh
        run: |
          $engineDir = Join-Path $env:ProgramFiles "MATLAB\$env:MATLAB_RELEASE\extern\engines\python"
          if (-not (Test-Path $engineDir)) { throw "MATLAB Engine installer missing: $engineDir" }
          python -m pip install $engineDir
          if ($LASTEXITCODE -ne 0) { throw "MATLAB Engine installation failed: $LASTEXITCODE" }

      - name: Call Chebfun classdef methods from Python
        shell: pwsh
        run: python ci/python_engine/chebfun_engine_demo.py

      - name: Upload Python MATLAB results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-matlab-chebfun-engine-windows
          path: python_engine_results/
          if-no-files-found: warn
