# Python -> MATLAB Engine -> original Chebfun classdef objects -> NumPy.
# External-language APIs require a self-hosted runner with an independently
# licensed MATLAB; the GitHub-hosted MATLAB batch license cannot run Engine.
name: Python calls MATLAB Chebfun (Engine)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-chebfun-engine:
    runs-on: [self-hosted, linux, matlab-r2026b]
    timeout-minutes: 30
    env:
      MATLAB_ROOT: /usr/local/MATLAB/R2026b
    steps:
      - name: Checkout Chebfun
        uses: actions/checkout@v4

      - name: Select and verify licensed MATLAB R2026b
        shell: bash
        run: |
          test -x "$MATLAB_ROOT/bin/matlab"
          echo "$MATLAB_ROOT/bin" >> "$GITHUB_PATH"
          "$MATLAB_ROOT/bin/matlab" -batch "assert(strcmp(version('-release'),'2026b')); disp(version)"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install NumPy and matching MATLAB Engine API
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 matlabengine==26.2.5

      - name: Call Chebfun classdef methods from Python
        run: python ci/python_engine/chebfun_engine_demo.py

      - name: Upload Python/Matlab results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-matlab-chebfun-engine-r2026b
          path: python_engine_results/
          if-no-files-found: warn
