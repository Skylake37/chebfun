# True package-to-package float64 precision comparison on MATLAB + Python.
# This workflow uses the original Chebfun sources in this public fork.
name: Chebfun vs NumPy precision

on:
  push:
    branches:
      - master
      - 'experiment/matlab-chebfun-numpy-precision-*'
    paths:
      - '.github/workflows/chebfun-numpy-precision.yml'
      - 'ci/precision/**'
  workflow_dispatch:
    inputs:
      execution_environment:
        description: Where to run the precision comparison
        type: choice
        required: true
        default: github-hosted
        options:
          - github-hosted
          - windows-local
      matlab_release:
        description: MATLAB installed on Windows (for windows-local)
        type: choice
        required: true
        default: R2026a
        options:
          - R2026a
          - R2026b

permissions:
  contents: read

jobs:
  chebfun-numpy-precision:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.execution_environment == 'github-hosted' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout original Chebfun
        uses: actions/checkout@v4

      - name: Set up MATLAB R2024b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b

      - name: Export actual MATLAB/Chebfun results
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(pwd); addpath(fullfile(pwd,'ci','precision')); chebfun_precision_export

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install numerical comparison packages
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 mpmath==1.3.0

      - name: Compare with NumPy and 80-digit mpmath
        run: python ci/precision/compare_precision.py

      - name: Record commit and runtime versions
        if: always()
        shell: bash
        run: |
          mkdir -p precision_results
          git rev-parse HEAD > precision_results/chebfun_commit.txt
          python -V > precision_results/python_version.txt
          python -m pip freeze > precision_results/python_packages.txt

      - name: Upload numerical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chebfun-matlab-vs-numpy-precision
          path: precision_results/
          if-no-files-found: warn

  windows-local-precision:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_environment == 'windows-local' }}
    runs-on: [self-hosted, windows, x64, matlab-engine]
    timeout-minutes: 60
    env:
      MATLAB_RELEASE: ${{ inputs.matlab_release }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Mask local runner identifiers
        run: |
          foreach ($value in @(
            $env:USERNAME, $env:USERDOMAIN, $env:COMPUTERNAME,
            $env:RUNNER_NAME, $env:USERPROFILE, $env:HOME,
            $env:APPDATA, $env:LOCALAPPDATA,
            $env:GITHUB_WORKSPACE, $env:RUNNER_WORKSPACE, $env:RUNNER_TEMP
          )) {
            if ($value -and $value.Length -ge 4) {
              Write-Output "::add-mask::$value"
              Write-Output "::add-mask::$($value.Replace('\', '/'))"
            }
          }

      - name: Update persistent Chebfun checkout
        run: |
          $repo = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force -Path $repo | Out-Null
          if (-not (Test-Path (Join-Path $repo '.git'))) {
            git -C $repo -q init
            if ($LASTEXITCODE -ne 0) { throw 'git init failed' }
            git -C $repo remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
            if ($LASTEXITCODE -ne 0) { throw 'git remote add failed' }
          }
          git -C $repo fetch --quiet --no-tags --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
          git -C $repo checkout --quiet --detach --force $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'git checkout failed' }
          $actual = (git -C $repo rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw "Checkout mismatch: $actual" }
          Write-Host "Chebfun checkout: $($actual.Substring(0, 12))"

      - name: Verify local MATLAB and provision isolated uv environment
        run: |
          if (-not (Get-Command uv -ErrorAction SilentlyContinue)) {
            throw 'uv is required. Install it once with: winget install --id astral-sh.uv -e ; then restart run.cmd'
          }
          python -c "import sys; assert sys.version_info[:3] == (3, 11, 9), 'Expected Python 3.11.9'; print('Base Python: 3.11.9')"
          if ($LASTEXITCODE -ne 0) { throw 'Incorrect base Python interpreter' }
          $basePython = (python -c "import sys; print(sys.executable)").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not locate base Python' }
          $venv = Join-Path $env:GITHUB_WORKSPACE '.venv-chebfun-precision'
          $venvPython = Join-Path $venv 'Scripts\python.exe'
          if (-not (Test-Path $venvPython)) {
            uv --quiet venv --no-python-downloads --python $basePython $venv
            if ($LASTEXITCODE -ne 0) { throw 'uv failed to create isolated environment' }
          }
          & $venvPython -c "import sys; assert sys.prefix != sys.base_prefix; assert sys.version_info[:3] == (3,11,9); print('uv environment: isolated Python 3.11.9')"
          if ($LASTEXITCODE -ne 0) { throw 'Invalid isolated Python environment' }
          uv --quiet pip install --python $venvPython numpy==2.3.5 mpmath==1.3.0
          if ($LASTEXITCODE -ne 0) { throw 'uv failed to install isolated numerical dependencies' }
          & $venvPython -c "import sys, pathlib, numpy, mpmath; base=pathlib.Path(sys.prefix).resolve(); assert all(pathlib.Path(p.__file__).resolve().is_relative_to(base) for p in (numpy,mpmath)), 'Package escaped virtual environment'; print('Isolated packages: NumPy', numpy.__version__, 'mpmath', mpmath.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot import packages from isolated uv environment' }
          $matlabExe = Join-Path $env:ProgramFiles "MATLAB\$env:MATLAB_RELEASE\bin\matlab.exe"
          if (-not (Test-Path $matlabExe)) { throw "MATLAB executable not found: $matlabExe" }

      - name: Export real Chebfun results from local MATLAB
        run: |
          $matlabExe = Join-Path $env:ProgramFiles "MATLAB\$env:MATLAB_RELEASE\bin\matlab.exe"
          $output = Join-Path $env:GITHUB_WORKSPACE 'precision_results'
          if (Test-Path $output) { Remove-Item -Recurse -Force $output }
          Push-Location $env:GITHUB_WORKSPACE
          try {
            & $matlabExe -batch "assert(strcmp(['R' version('-release')], '$env:MATLAB_RELEASE')); addpath(pwd); addpath(fullfile(pwd,'ci','precision')); chebfun_precision_export"
            if ($LASTEXITCODE -ne 0) { throw "MATLAB export failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Compare with NumPy and 80-digit mpmath
        run: |
          Push-Location $env:GITHUB_WORKSPACE
          try {
            $venvPython = Join-Path $env:GITHUB_WORKSPACE '.venv-chebfun-precision\Scripts\python.exe'
            & $venvPython ci/precision/compare_precision.py
            if ($LASTEXITCODE -ne 0) { throw "Python precision comparison failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Preserve results locally
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'precision_results'
          if (-not (Test-Path (Join-Path $source 'SUMMARY.md'))) { throw 'Missing precision summary' }
          $archive = Join-Path $env:GITHUB_WORKSPACE "_local_results\precision\$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force -Path $archive | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $archive -Recurse -Force
          Write-Host "Results saved in local run archive: _local_results"
          "Chebfun precision results: _local_results/precision/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
